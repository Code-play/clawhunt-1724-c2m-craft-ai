<h1>作品系列</h1>
<section id="range"><h2>三个系列，一套工艺语言</h2><p>海岸、庭院与窑火三个系列共用色板系统，买家可以在同一季里组合出产品线，而不必担心互相冲突。</p></section><section id="craft"><h2>每个纹样都有授权记录</h2><p>纹样没有授权来源、使用范围与审核状态就进不了资源库；传统原型的引用按合同保持非独占。</p></section><section id="proof"><h2>编号、证书、可流转</h2><p>限量作品在下单时预留编号、在结算时正式发行；证书哈希随作品流转，收藏链条保持连续。</p></section>
<form class="inquiry" method="post" action="/api/growth/inquiry"><label class="field"><span>您的姓名</span><input type="text" name="contact_name" required></label><label class="field"><span>工作邮箱</span><input type="email" name="email" required></label><label class="field"><span>公司名称</span><input type="text" name="company"></label><label class="field"><span>国家代码</span><input type="text" name="country" required></label><label class="field"><span>您需要什么</span><select name="intent" required><option value="sample_request">索取样品</option><option value="bulk_quote">批量报价</option><option value="oem">贴牌代工</option><option value="partnership">合作洽谈</option><option value="information">一般咨询</option></select></label><label class="field"><span>请描述款式、数量与目标市场</span><textarea name="message" rows="4" required></textarea></label><button type="submit">提交询盘</button><p class="hint">已收到，外贸同事将在一个工作日内回复。</p></form>
